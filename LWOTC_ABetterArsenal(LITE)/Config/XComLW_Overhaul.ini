STILETTO_DMGMOD=1		; To everybody
STILETTO_ALIEN_DMG=1 ;3 ;1	; More To Aliens

NEEDLE_DMGMOD=1			; TO everybody
NEEDLE_ADVENT_DMG=1 ;4 ;1		; More To Advent

