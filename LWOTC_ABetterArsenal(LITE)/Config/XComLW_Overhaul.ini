;;---------------------------------------------------------------------------------------------
;;-- [LWOTC] A BETTER ARSENAL (LITE)
;;-- This file defines a lot of behavior however this mod specifically focuses in on the 
;;-- on the elements the define the armor and item characteristics.
;;---------------------------------------------------------------------------------------------
;; Buffing rules used for full version:
;;
;; there is no consistent rule here for how buffs were applied.  
;; Look to the ";##   ;##" numbers to see the full version value was and the game default value
;;
;; Most all values had +1 to the default value.
;;---------------------------------------------------------------------------------------------
;; Note on Modding LongWar 2 for WOTC: LW is a significant overhaul to the game to do exactly 
;; as its name implies, make the game longer. My mods boost stats and scalars that greatly 
;; accelerate the speed to complete the game. To keep to the intent of LW2 there have been 
;; minimal changes that would progress the game too quickly but still give you the OP goodness
;; you want from this mod.
;;---------------------------------------------------------------------------------------------

[LW_Overhaul.X2DownloadableContentInfo_LongWarOfTheChosen]
; This affects all weapon sound ranges by this many meters (1 tile = 1.5 meters)
; Reducing sound range has the effect of making it less likely nearby enemies will enter combat
SOUND_RANGE_DIFFICULTY_MODIFIER[0]=-3.0 ;-5.0 ;-3.0
SOUND_RANGE_DIFFICULTY_MODIFIER[1]=-1.0 ;-3.0 ;0.0
SOUND_RANGE_DIFFICULTY_MODIFIER[2]=0.0 ;-2.0 ;0.0
SOUND_RANGE_DIFFICULTY_MODIFIER[3]=0.0 ;-1.0 ;0.0

