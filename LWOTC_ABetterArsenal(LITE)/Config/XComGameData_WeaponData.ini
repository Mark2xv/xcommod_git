;;---------------------------------------------------------------------------------------------
;;-- [LWOTC] A BETTER ARSENAL (LITE)
;;---------------------------------------------------------------------------------------------
;; Note on Modding LongWar 2 for WOTC: LW is a significant overhaul to the game to do exactly 
;; as its name implies, make the game longer. My mods boost stats and scalars that greatly 
;; accelerate the speed to complete the game. To keep to the intent of LW2 there have been 
;; minimal changes that would progress the game too quickly but still give you the OP goodness
;; you want from this mod.
;;---------------------------------------------------------------------------------------------
;;-- This file defines the base characteristics of all the weapons used in the game.
;;-- Only player usable weapons are modified here.  Enemy weapons are not included or are untouched.
;;---------------------------------------------------------------------------------------------
;; Typical Buffing rules used for lite version:
;;
;; Base Damage: damage=+2, spread=+0, PlusOne=+0, crit=+0, pierce:+0, shred:+0     - Conventional
;; Base Damage: damage=+2, spread=+0, PlusOne=+0, crit=+0, pierce:+0, shred:+1     - Magnetic
;; Base Damage: damage=+2, spread=+0, PlusOne=+0, crit=+1, pierce:+1, shred:+0     - Beam
;; Base Damage: damage=+2, spread=+0, PlusOne=+0, crit=+1, pierce:+1, shred:+1     - T4
;;
;;             lite (full)
;;         aim:	+10	(+20)		(aim modifier)
;; crit chance: +5	(+10)		(more punch per shot)
;;    clipsize: +2	(+30)		(how many shots before reload)
;;	     range: +5	(+20)		(for thrown or shot explosives)
;;      radius: +2  (+6)		(area of effect items)
;; sound range: -0	(-10)		(blast sounds are the game default)
;; envrmnt dmg: +0	(+10)		(destructive power is returned to game default)
;;
;;---------------------------------------------------------------------------------------------
;; Buffing rules used for full version:
;;
;; Base Damage: damage=+5, spread=+0, PlusOne=+0, crit=+2, pierce:+1, shred:+0     - Conventional
;; Base Damage: damage=+5, spread=+0, PlusOne=+0, crit=+2, pierce:+1, shred:+1     - Magnetic
;; Base Damage: damage=+5, spread=+0, PlusOne=+0, crit=+2, pierce:+2, shred:+2     - Beam
;; Base Damage: damage=+5, spread=+0, PlusOne=+0, crit=+2, pierce:+3, shred:+3     - T4
;;
;;         aim:	+20		(never miss)
;; crit chance: +10		(more punch per shot)
;;    clipsize: +30		(pretty much unlimited ammo - makes reloader and clip size mods obsolete)
;;	     range: +20		(for thrown or shot explosives)
;;      radius: +6		(area of effect items)
;; sound range: -10		(blasts are quieter)
;; envrmnt dmg: +10		(weaponry is more destructive to the enviornment)
;;
;;---------------------------------------------------------------------------------------------
;; Where changes were made in inline lists i have coppied and commented the line with 
;;   ;L for lite version values
;;   ;F for full version values
;;   ;O for original version values
;; Where there are simple name = value pairs the convention is 
;;   variable=value ;full version value ;original value
;;   ex: variable=123 ;223 ;23
;;---------------------------------------------------------------------------------------------

